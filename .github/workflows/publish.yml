name: Publish to npm

# Publishes the package to npm with provenance, as required for verified
# n8n community nodes. Triggered when a GitHub Release is published.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    # Gates publishing behind the "npm" environment (configure required reviewers in
    # repo Settings → Environments). If the npm trusted publisher config specifies an
    # environment, it must be this one.
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing requires npm >= 11.5.1; Node 22 bundles npm 10.x.
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # `npm run release` (n8n-node release) detects GitHub Actions and runs lint +
      # build, then `npm publish` with provenance (NPM_CONFIG_PROVENANCE=true) and the
      # CLI's required RELEASE_MODE flag. A raw `npm publish` is intentionally blocked
      # by the CLI's prepublishOnly guard, so it must go through the release command.
      # Auth is via OIDC trusted publishing (configured on npmjs.com for this repo +
      # workflow file) — no npm token; id-token: write above enables the OIDC exchange
      # and the provenance attestation.
      - name: Release (lint, build, publish with provenance)
        run: npm run release
