name: Publish to npm

# Publishes the package to npm with provenance, as required for verified
# n8n community nodes. Triggered when a GitHub Release is published.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    # Gates publishing behind the "npm" environment (configure required reviewers
    # and scope the NPM_TOKEN secret to it in repo Settings → Environments).
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # `npm run release` (n8n-node release) detects GitHub Actions and runs lint +
      # build, then `npm publish` with provenance (NPM_CONFIG_PROVENANCE=true) and the
      # CLI's required RELEASE_MODE flag. A raw `npm publish` is intentionally blocked
      # by the CLI's prepublishOnly guard, so it must go through the release command.
      # Authenticates with an npm automation token (NPM_TOKEN secret); id-token: write
      # above enables the provenance attestation.
      - name: Release (lint, build, publish with provenance)
        run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
