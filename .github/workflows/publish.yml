name: Publish to npm

# Publishes the package to npm with provenance, as required for verified
# n8n community nodes. Triggered when a GitHub Release is published.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Published via GitHub Actions with a provenance statement (required for n8n
      # verification from 2026-05-01). Authenticates with an npm automation token
      # (NPM_TOKEN secret); id-token: write above enables the provenance attestation.
      # Optional later: switch to OIDC trusted publishing to drop the token.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
