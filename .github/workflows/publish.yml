name: Publish to npm

# Publishes the package to npm with provenance, as required for verified
# n8n community nodes. Triggered when a GitHub Release is published.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 22 ships npm 10.x.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # No NPM_TOKEN: authentication and provenance are handled via GitHub OIDC
      # (configure the trusted publisher for this package on npmjs.com).
      - name: Publish
        run: npm publish --access public
